[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Aprendizaje_automatico_parcial_2026"
version = "0.0.1"
description = "Proyecto de aprendizaje autom\u00e1tico para el parcial 2026"
authors = [
  { name = "Ariel Tunon" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["Aprendizaje_automatico_parcial_2026"]
include = ["pyproject.toml", "Aprendizaje_automatico_parcial_2026/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["Aprendizaje_automatico_parcial_2026"]
force-sort-within-sections = true

